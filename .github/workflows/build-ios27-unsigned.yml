name: Build iOS 27 Unsigned IPA

on:
  push:
    branches:
      - ios27-unsigned-ipa
      - ios27-final-exact
  pull_request:
    branches:
      - emt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xcode 27 real-device unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout Azula
        uses: actions/checkout@v4

      - name: Verify Xcode 27 / iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: ${SDK_VERSION}"
          case "${SDK_VERSION}" in
            27*) ;;
            *) echo "Expected iOS 27 SDK, got ${SDK_VERSION}" >&2; exit 1 ;;
          esac

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen dpkg
          xcodegen --version
          dpkg-deb --version | head -1

      - name: Prepare ZIPFoundation for Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Vendor/ZIPFoundation
          mkdir -p Vendor
          git clone --depth 1 --branch 0.9.20 https://github.com/weichsel/ZIPFoundation.git Vendor/ZIPFoundation
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("Vendor/ZIPFoundation/Package.swift")
          text = manifest.read_text()
          text = re.sub(r"\.iOS\(\.v(?:9|10|11|12|13|14)\)", ".iOS(.v15)", text)
          manifest.write_text(text)
          PY

      - name: Validate exact user AppIcon
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="Azula/Assets.xcassets/AppIcon.appiconset"
          ICON="$ICONSET/Azula-Exact.png"
          MANIFEST="$ICONSET/Contents.json"
          EXPECTED_SHA="3ff1e325c0fb2d6b933db7483415db8557ecaeba31cca3aa6bec1dfdeb3d427d"

          test -s "$ICON"
          grep -q '"Azula-Exact.png"' "$MANIFEST"
          ! grep -q 'Azula-Fire' "$MANIFEST"
          ! grep -q 'Azula.png' "$MANIFEST"
          test ! -e "$ICONSET/Azula-Fire.svg"

          EXTRA="$(find "$ICONSET" -maxdepth 1 -type f ! -name 'Contents.json' ! -name 'Azula-Exact.png' -print -quit)"
          test -z "$EXTRA"

          WIDTH="$(sips -g pixelWidth "$ICON" | awk '/pixelWidth:/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$ICON" | awk '/pixelHeight:/ {print $2}')"
          ACTUAL_SHA="$(shasum -a 256 "$ICON" | awk '{print $1}')"
          echo "Exact AppIcon: ${WIDTH}x${HEIGHT} sha256=${ACTUAL_SHA}"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Bundle current ElleKit for iOS 27
        shell: bash
        run: |
          set -euo pipefail
          ELLEKIT_DEB_URL="https://raw.githubusercontent.com/dhinakg/ellekit-official/main/pool/ellekit_1.2_iphoneos-arm.deb"
          rm -rf /tmp/azula-ellekit /tmp/azula-ellekit.deb
          mkdir -p /tmp/azula-ellekit
          curl -L --fail --retry 3 --retry-delay 2 "$ELLEKIT_DEB_URL" -o /tmp/azula-ellekit.deb
          dpkg-deb -x /tmp/azula-ellekit.deb /tmp/azula-ellekit

          ELLEKIT_PATH="$(find /tmp/azula-ellekit -type f -name 'libellekit.dylib' -print -quit)"
          test -n "$ELLEKIT_PATH"
          cp "$ELLEKIT_PATH" Azula/libellekit.dylib
          ARCHS="$(lipo -archs Azula/libellekit.dylib)"
          echo "ElleKit arches: $ARCHS"
          case " $ARCHS " in
            *" arm64 "*) ;;
            *) echo "ElleKit package does not contain arm64" >&2; exit 1 ;;
          esac

      - name: Validate strict file type source
        shell: bash
        run: |
          set -euo pipefail
          FILE="Azula/Views/FilePickerView.swift"
          PROJECT="project.yml"

          ! grep -q 'selectableFileTypes' "$FILE"
          ! grep -q 'allowedContentTypes: \[.item\]' "$FILE"
          ! grep -q 'allowedContentTypes: \[.data\]' "$FILE"
          ! grep -q 'UTType(filenameExtension:' "$FILE"

          grep -q 'exportedAs: "com.nightvibes33.azula.ipa"' "$FILE"
          grep -q 'exportedAs: "com.nightvibes33.azula.dylib"' "$FILE"
          grep -q 'allowedContentTypes: \[Self.ipaType\]' "$FILE"
          grep -q 'allowedContentTypes: \[Self.dylibType\]' "$FILE"
          grep -q 'requiredExtension: "ipa"' "$FILE"
          grep -q 'requiredExtension: "dylib"' "$FILE"

          grep -q 'UTExportedTypeDeclarations:' "$PROJECT"
          grep -q 'com.nightvibes33.azula.ipa' "$PROJECT"
          grep -q 'com.nightvibes33.azula.dylib' "$PROJECT"
          grep -q -- '- ipa' "$PROJECT"
          grep -q -- '- dylib' "$PROJECT"
          grep -q 'CFBundleDocumentTypes:' "$PROJECT"

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          SETTINGS="$(xcodebuild -project Azula.xcodeproj -scheme Azula -sdk iphoneos -destination 'generic/platform=iOS' -showBuildSettings)"
          echo "$SETTINGS" | grep -E 'IPHONEOS_DEPLOYMENT_TARGET|SDKROOT|SWIFT_VERSION|PRODUCT_BUNDLE_IDENTIFIER|TARGETED_DEVICE_FAMILY|SUPPORTED_PLATFORMS|MARKETING_VERSION|CURRENT_PROJECT_VERSION'
          echo "$SETTINGS" | grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 27.0'
          echo "$SETTINGS" | grep -q 'TARGETED_DEVICE_FAMILY = 1'
          echo "$SETTINGS" | grep -q 'MARKETING_VERSION = 2.1.3'
          echo "$SETTINGS" | grep -q 'CURRENT_PROJECT_VERSION = 6'

      - name: Build unsigned real-device app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project Azula.xcodeproj \
            -scheme Azula \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Validate built iOS 27 app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/Azula.app"
          PLIST="$APP_PATH/Info.plist"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Azula"
          test -f "$APP_PATH/libellekit.dylib"
          test -f "$APP_PATH/Assets.car"
          test "$(lipo -archs "$APP_PATH/Azula")" = "arm64"

          MINIMUM_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")"
          DEVICE_FAMILY="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          echo "MinimumOSVersion=$MINIMUM_OS UIDeviceFamily[0]=$DEVICE_FAMILY version=$VERSION build=$BUILD"
          test "$MINIMUM_OS" = "27.0"
          test "$DEVICE_FAMILY" = "1"
          test "$VERSION" = "2.1.3"
          test "$BUILD" = "6"

          IPA_UTI="$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeIdentifier' "$PLIST")"
          IPA_EXT="$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0' "$PLIST")"
          DYLIB_UTI="$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:1:UTTypeIdentifier' "$PLIST")"
          DYLIB_EXT="$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:1:UTTypeTagSpecification:public.filename-extension:0' "$PLIST")"
          echo "UTIs: $IPA_UTI .$IPA_EXT / $DYLIB_UTI .$DYLIB_EXT"
          test "$IPA_UTI" = "com.nightvibes33.azula.ipa"
          test "$IPA_EXT" = "ipa"
          test "$DYLIB_UTI" = "com.nightvibes33.azula.dylib"
          test "$DYLIB_EXT" = "dylib"

          /usr/bin/assetutil --info "$APP_PATH/Assets.car" > /tmp/azula-assets.json
          grep -q 'AppIcon' /tmp/azula-assets.json

          if grep -R -n 'apple-magnifier://install' Azula --include='*.swift'; then
            echo "TrollStore-only install path still exists" >&2
            exit 1
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/Azula.app"
          ICON_PATH="$PWD/Azula/Assets.xcassets/AppIcon.appiconset/Azula-Exact.png"
          rm -rf dist
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/Azula.app
          cp "$ICON_PATH" dist/Azula-Exact-AppIcon.png
          (
            cd dist
            /usr/bin/zip -qry Azula-iOS27-unsigned.ipa Payload
          )

          test -s dist/Azula-iOS27-unsigned.ipa
          test -s dist/Azula-Exact-AppIcon.png
          shasum -a 256 dist/Azula-iOS27-unsigned.ipa | tee dist/Azula-iOS27-unsigned.ipa.sha256
          shasum -a 256 dist/Azula-Exact-AppIcon.png | tee dist/Azula-Exact-AppIcon.png.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Azula-iOS27-unsigned
          path: |
            dist/Azula-iOS27-unsigned.ipa
            dist/Azula-iOS27-unsigned.ipa.sha256
            dist/Azula-Exact-AppIcon.png
            dist/Azula-Exact-AppIcon.png.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
