name: Build iOS 27 Unsigned IPA

on:
  push:
    branches:
      - ios27-unsigned-ipa
      - ios27-final-exact
  pull_request:
    branches:
      - emt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xcode 27 real-device unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout Azula
        uses: actions/checkout@v4

      - name: Verify Xcode 27 / iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: ${SDK_VERSION}"
          case "${SDK_VERSION}" in
            27*) ;;
            *) echo "Expected iOS 27 SDK, got ${SDK_VERSION}" >&2; exit 1 ;;
          esac

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen dpkg
          xcodegen --version
          dpkg-deb --version | head -1

      - name: Prepare ZIPFoundation for Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Vendor/ZIPFoundation
          mkdir -p Vendor
          git clone --depth 1 --branch 0.9.20 https://github.com/weichsel/ZIPFoundation.git Vendor/ZIPFoundation
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Vendor/ZIPFoundation/Package.swift')
          t = p.read_text()
          t = re.sub(r'\.iOS\(\.v(?:9|10|11|12|13|14)\)', '.iOS(.v15)', t)
          p.write_text(t)
          PY

      - name: Prepare uploaded AppIcon
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="Azula/Assets.xcassets/AppIcon.appiconset"
          ICON="$ICONSET/Azula-Exact.png"
          MANIFEST="$ICONSET/Contents.json"
          SOURCE="/tmp/Azula-user-upload.jpg"
          SOURCE_URL='https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F4e77c808-6639-4f67-9039-9c7746509579/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAIPPmR8fbIfVj5WDvJF0zNRF5i1UG_9QX6tGnH_pUFsL&exp=1788496993&osig=AAAAAAAAAAAAAAAAAAAAAHw3BBQTjtZJ8VavfluuNcUyZXvZLa9ZEcMI8k6E0zsC&signer=media-rpc&x-canva-quality=thumbnail'

          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o "$SOURCE"
          test -s "$SOURCE"
          rm -f "$ICONSET/Azula-Fire.svg" "$ICONSET/Azula-Fire.png" "$ICONSET/Azula.png"
          sips -z 1024 1024 -s format png "$SOURCE" --out "$ICON" >/dev/null
          test -s "$ICON"
          grep -q '"Azula-Exact.png"' "$MANIFEST"

      - name: Bundle current ElleKit for iOS 27
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/dhinakg/ellekit-official/main/pool/ellekit_1.2_iphoneos-arm.deb"
          rm -rf /tmp/azula-ellekit /tmp/azula-ellekit.deb
          mkdir -p /tmp/azula-ellekit
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o /tmp/azula-ellekit.deb
          dpkg-deb -x /tmp/azula-ellekit.deb /tmp/azula-ellekit
          P="$(find /tmp/azula-ellekit -type f -name 'libellekit.dylib' -print -quit)"
          test -n "$P"
          cp "$P" Azula/libellekit.dylib
          ARCHS="$(lipo -archs Azula/libellekit.dylib)"
          echo "ElleKit arches: $ARCHS"
          case " $ARCHS " in *" arm64 "*) ;; *) exit 1 ;; esac

      - name: Validate hardcoded IPA and dylib types
        shell: bash
        run: |
          set -euo pipefail
          FILE="Azula/Views/FilePickerView.swift"
          PROJECT="project.yml"

          grep -q 'importedAs: "com.apple.itunes.ipa"' "$FILE"
          grep -q 'importedAs: "com.apple.mach-o-dylib"' "$FILE"
          grep -q 'allowedContentTypes: \[Self.ipaType\]' "$FILE"
          grep -q 'allowedContentTypes: \[Self.dylibType\]' "$FILE"
          grep -q 'requiredExtension: "ipa"' "$FILE"
          grep -q 'requiredExtension: "dylib"' "$FILE"

          grep -q 'UTImportedTypeDeclarations:' "$PROJECT"
          ! grep -q 'UTExportedTypeDeclarations:' "$PROJECT"
          grep -q 'UTTypeIdentifier: com.apple.itunes.ipa' "$PROJECT"
          grep -q 'UTTypeIdentifier: com.apple.mach-o-dylib' "$PROJECT"
          grep -q 'public.filename-extension:' "$PROJECT"
          grep -q -- '- ipa' "$PROJECT"
          grep -q -- '- dylib' "$PROJECT"

          ! grep -q 'com.nightvibes33.azula.ipa' "$FILE" "$PROJECT"
          ! grep -q 'com.nightvibes33.azula.dylib' "$FILE" "$PROJECT"

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          SETTINGS="$(xcodebuild -project Azula.xcodeproj -scheme Azula -sdk iphoneos -destination 'generic/platform=iOS' -showBuildSettings)"
          echo "$SETTINGS" | grep -E 'IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY|MARKETING_VERSION|CURRENT_PROJECT_VERSION'
          echo "$SETTINGS" | grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 27.0'
          echo "$SETTINGS" | grep -q 'TARGETED_DEVICE_FAMILY = 1'
          echo "$SETTINGS" | grep -q 'MARKETING_VERSION = 2.1.4'
          echo "$SETTINGS" | grep -q 'CURRENT_PROJECT_VERSION = 7'

      - name: Build unsigned real-device app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project Azula.xcodeproj \
            -scheme Azula \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Validate built iOS 27 app
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/Azula.app"
          PLIST="$APP/Info.plist"

          test -d "$APP"
          test -f "$APP/Azula"
          test -f "$APP/Assets.car"
          test -f "$APP/libellekit.dylib"
          test "$(lipo -archs "$APP/Azula")" = "arm64"

          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")" = "27.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$PLIST")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "2.1.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "7"

          IPA_UTI="$(/usr/libexec/PlistBuddy -c 'Print :UTImportedTypeDeclarations:0:UTTypeIdentifier' "$PLIST")"
          IPA_EXT="$(/usr/libexec/PlistBuddy -c 'Print :UTImportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0' "$PLIST")"
          DYLIB_UTI="$(/usr/libexec/PlistBuddy -c 'Print :UTImportedTypeDeclarations:1:UTTypeIdentifier' "$PLIST")"
          DYLIB_EXT="$(/usr/libexec/PlistBuddy -c 'Print :UTImportedTypeDeclarations:1:UTTypeTagSpecification:public.filename-extension:0' "$PLIST")"
          DOC_IPA="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$PLIST")"
          DOC_DYLIB="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:LSItemContentTypes:0' "$PLIST")"

          echo "Built imported UTIs: $IPA_UTI .$IPA_EXT / $DYLIB_UTI .$DYLIB_EXT"
          test "$IPA_UTI" = "com.apple.itunes.ipa"
          test "$IPA_EXT" = "ipa"
          test "$DYLIB_UTI" = "com.apple.mach-o-dylib"
          test "$DYLIB_EXT" = "dylib"
          test "$DOC_IPA" = "com.apple.itunes.ipa"
          test "$DOC_DYLIB" = "com.apple.mach-o-dylib"

          /usr/bin/assetutil --info "$APP/Assets.car" > /tmp/assets.json
          grep -q 'AppIcon' /tmp/assets.json

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/Azula.app"
          rm -rf dist
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/Azula.app
          (cd dist && /usr/bin/zip -qry Azula-iOS27-unsigned.ipa Payload)
          shasum -a 256 dist/Azula-iOS27-unsigned.ipa | tee dist/Azula-iOS27-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Azula-iOS27-unsigned
          path: |
            dist/Azula-iOS27-unsigned.ipa
            dist/Azula-iOS27-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
