name: Azula
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    path: Vendor/ZIPFoundation

targets:
  Azula:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Azula
        excludes:
          - Assets.xcassets
          - Azula.entitlements
          - libellekit.dylib
          - Info.plist
      - path: Azula/Assets.xcassets
        buildPhase: resources
      - path: Azula/libellekit.dylib
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: Azula/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Azula
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
              public.mime-type:
                - application/x-ios-app
          - UTTypeIdentifier: com.apple.mach-o-dylib
            UTTypeDescription: Mach-O Dynamic Library
            UTTypeConformsTo:
              - public.data
              - public.unix-executable
            UTTypeTagSpecification:
              public.filename-extension:
                - dylib
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
          - CFBundleTypeName: Mach-O Dynamic Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.mach-o-dylib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.azula
        PRODUCT_NAME: Azula
        MARKETING_VERSION: 2.1.6
        CURRENT_PROJECT_VERSION: 9
        IPHONEOS_DEPLOYMENT_TARGET: 27.0
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    scheme:
      gatherCoverageData: false
