name: Azula
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    path: Vendor/ZIPFoundation

targets:
  Azula:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Azula
        excludes:
          - Assets.xcassets
          - Azula.entitlements
          - libellekit.dylib
      - path: Azula/Assets.xcassets
        buildPhase: resources
      - path: Azula/libellekit.dylib
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.azula
        PRODUCT_NAME: Azula
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        IPHONEOS_DEPLOYMENT_TARGET: 15.0
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Azula
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    scheme:
      gatherCoverageData: false
